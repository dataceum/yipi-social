[project]
name = "backend"
version = "0.1.0"
description = "Dataceum PaaS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "alembic-postgresql-enum>=1.10.0",
    "asyncpg>=0.31.0",
    # passlib 1.7.4 may warn about bcrypt.__about__ version detection (non-blocking)
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "phonenumbers>=9.0.36",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.0,<2.0.32",
    "sqlmodel>=0.0.39",
]
